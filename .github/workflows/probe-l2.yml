# TEMP (ENG-1944 probe 2): one identical run-name line at every hop.
name: probe hop two with a deliberately long workflow name to test truncation
run-name: "${{ github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.display_title || github.event.workflow_run.head_sha }} > ${{ github.workflow }}"
on:
  workflow_run:
    workflows: [probe hop one with a deliberately long workflow name to test truncation]
    types: [completed]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "github.sha=${{ github.sha }}"

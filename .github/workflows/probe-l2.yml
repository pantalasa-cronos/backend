# TEMP (ENG-1944 probe): second hop, passing the first hop's title through.
name: probe-l2
run-name: "probe-l2 (${{ github.event.workflow_run.display_title }})"
on:
  workflow_run:
    workflows: [probe-l1]
    types: [completed]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "github.sha=${{ github.sha }}"
          echo "upstream id=${{ github.event.workflow_run.id }} head_sha=${{ github.event.workflow_run.head_sha }} title=${{ github.event.workflow_run.display_title }}"

# TEMP (ENG-1911 probe): which commit does GitHub record a workflow_run-triggered run against?
name: wfrun sha probe
on:
  workflow_run:
    workflows: [GH-Actions]
    types: [completed]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "github.sha=${{ github.sha }}"
          echo "upstream head_sha=${{ github.event.workflow_run.head_sha }} upstream run=${{ github.event.workflow_run.id }}"
